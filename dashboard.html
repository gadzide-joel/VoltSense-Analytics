<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>VoltSense - Smart Grid & AI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .container { background: white; width: 90%; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .top-info { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .card { background: #e3f2fd; padding: 15px; border-radius: 8px; width: 40%; font-weight: bold; color: #0d47a1; }
        .alert { padding: 15px; margin: 15px 0; border-radius: 8px; font-weight: bold; font-size: 1.1em; }
        .alert-ok { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; }
        .alert-critical { background-color: #ffebee; color: #c62828; border: 1px solid #c62828; }
        .charts-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ VoltSense Analytics : Surveillance & IA</h1>
        
        <div class="top-info">
            <div class="card" id="weatherCard">🌡️ Température Extérieure : -- °C</div>
            <div class="card" id="aiCard">🤖 Statut IA : Analyse active</div>
        </div>

        <div id="alertBox" class="alert alert-ok">Système stable - En attente de données...</div>
        
        <div class="charts-grid">
            <canvas id="voltageChart" height="50"></canvas>
            <canvas id="powerChart" height="50"></canvas>
        </div>
    </div>

    <script>
        function createChart(id, label, color) {
            return new Chart(document.getElementById(id).getContext('2d'), {
                type: 'line',
                data: { labels: [], datasets: [{ label: label, borderColor: color, backgroundColor: 'rgba(33, 150, 243, 0.1)', borderWidth: 2, data: [], fill: true, tension: 0.3 }] },
                options: { animation: false }
            });
        }

        const voltageChart = createChart('voltageChart', 'Tension (V)', '#2196F3');
        const powerChart = createChart('powerChart', 'Puissance (W)', '#4CAF50');

        async function updateDashboard() {
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/telemetry?limit=20');
                const data = await response.json();
                data.reverse();

                const labels = data.map(d => new Date(d.timestamp).toLocaleTimeString());
                
                voltageChart.data.labels = labels;
                voltageChart.data.datasets[0].data = data.map(d => d.voltage);
                voltageChart.update();

                powerChart.data.labels = labels;
                powerChart.data.datasets[0].data = data.map(d => d.power);
                powerChart.update();

                const latest = data[data.length - 1];
                document.getElementById('weatherCard').innerText = `🌡️ Température Extérieure : ${latest.temperature || 30.0} °C`;

                const alertBox = document.getElementById('alertBox');
                if (latest.voltage > 245.0 || latest.voltage < 195.0) {
                    alertBox.className = 'alert alert-critical';
                    alertBox.innerHTML = `⚠️ ALERTE : Variation anormale détectée (${latest.voltage}V)`;
                } else {
                    alertBox.className = 'alert alert-ok';
                    alertBox.innerHTML = `✅ Réseau stable - Paramètres nominaux`;
                }

            } catch (err) {
                console.error("Erreur de mise à jour du dashboard :", err);
            }
        }

        setInterval(updateDashboard, 5000);
        updateDashboard();
    </script>

</body>
</html>
